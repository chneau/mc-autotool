name: Publish

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  publish:
    name: Build & Release All Versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build all mod versions
        run: |
          curl https://mise.run | sh
          mise exec java@25 -- ./gradlew buildAll
          mkdir -p dist
          for v in versions/*; do
            if [ -d "$v/build/libs" ]; then
              ver=$(basename "$v")
              jar=$(ls $v/build/libs/*.jar 2>/dev/null | head -n 1)
              if [ -n "$jar" ]; then
                cp "$jar" "dist/autotool-${ver}.jar"
              fi
            fi
          done
          cp dist/autotool-26.4.jar dist/autotool.jar

      - name: Upload Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: latest
          target_commit: master
          overwrite: true
          make_latest: true
          release_name: Autotool (Latest)
